<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الطالب - تجهيز اللوائح المدرسية</title>
    
    <!-- Google Fonts - Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="assets/interface.mp4" type="video/mp4">
            <!-- Fallback if video doesn't exist -->
            <img src="assets/i5.png" alt="Background">
        </video>
        <div class="overlay"></div>
    </div>

    <!-- Main Container -->
    <main class="main-container">
        <!-- Header Section -->
        <header class="header">
            <div class="logo-container">
                <img src="assets/logo.png" alt="Logo" class="logo" id="logoImage">
            </div>
            <h1 class="main-title" id="mainTitle">تجهيز اللوائح المدرسية</h1>
            <p class="subtitle" id="subtitle">نوفر لك جميع الأدوات المدرسية بجودة عالية وأسعار مناسبة</p>
        </header>

        <!-- Social Proof Section -->
        <section class="social-proof" id="socialProof">
            <div class="proof-image-container">
                <img src="assets/b70ac3e2cf7d93c3c55ff783eb91a4e5.jpg" alt="Quality Proof" class="proof-image">
            </div>
            <div class="proof-text">
                <i class="fas fa-check-circle"></i>
                <span id="proofText">نجهز طلباتكم باحترافية وسرعة</span>
            </div>
        </section>

        <!-- Order Form Section -->
        <section class="form-section">
            <div class="glass-card" id="orderForm">
                <h2 class="form-title" id="formTitle">اطلب اللائحة الآن</h2>
                
                <form id="orderFormElement">
                    <!-- Order Type Selection -->
                    <div class="form-group">
                        <label class="form-label" id="orderTypeLabel">نوع الطلب:</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="orderType" value="pickup" checked>
                                <span class="radio-custom"></span>
                                <span class="radio-text" id="pickupOption">نوجدها ليك وتجي تاخذها واجدة</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="orderType" value="delivery">
                                <span class="radio-custom"></span>
                                <span class="radio-text" id="deliveryOption">التوصيل للمنزل</span>
                            </label>
                        </div>
                    </div>

                    <!-- Name Field -->
                    <div class="form-group">
                        <label class="form-label" for="fullName" id="nameLabel">الاسم الكامل:</label>
                        <input type="text" id="fullName" class="form-input" placeholder="أدخل اسمك الكامل" required>
                    </div>

                    <!-- Delivery Fields (Hidden by default) -->
                    <div class="delivery-fields" id="deliveryFields">
                        <div class="form-group">
                            <label class="form-label" for="address" id="addressLabel">عنوان التوصيل:</label>
                            <input type="text" id="address" class="form-input" placeholder="الحي، الشارع، رقم المنزل" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="availability" id="availabilityLabel">متى ستكون متوفراً:</label>
                            <textarea id="availability" class="form-input form-textarea" placeholder="مثال: متوفر يومياً بعد الساعة 5 مساءً" rows="3" required></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <i class="fab fa-whatsapp"></i>
                        <span id="submitBtnText">إرسال اللائحة عبر الواتساب</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p class="footer-text" id="footerText">© 2024 جميع الحقوق محفوظة</p>
                <div class="footer-links">
                    <a href="#" class="footer-link" id="emailLink">
                        <i class="fas fa-envelope"></i>
                        <span id="emailText">البريد الإلكتروني</span>
                    </a>
                    <a href="#" class="footer-link" id="mapLink" target="_blank">
                        <i class="fas fa-map-marker-alt"></i>
                        <span id="mapText">موقعنا على الخريطة</span>
                    </a>
                </div>
            </div>
        </footer>
    </main>

    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
